<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NUBO – Festival App Prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0B0B1E; --glass:rgba(255,255,255,.065); --glass2:rgba(255,255,255,.11); --edge:rgba(255,255,255,.10);
    --text:#F4F2FF; --muted:#ABA9CB;
    --lav:#C9BCFF; --lav-ink:#17123A; --lav-soft:rgba(201,188,255,.16);
    --peach:#FFC78A; --sky:#8FD3FF; --coral:#FF8A9A; --mint:#9BE8C8;
  }
  *{box-sizing:border-box}
  button,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh;background:#06061A;color:var(--text);font-family:Inter,system-ui,sans-serif;display:flex;gap:48px;align-items:center;justify-content:center;padding:32px 16px;flex-wrap:wrap}
  .side{max-width:280px;display:flex;flex-direction:column;gap:16px}
  .side h1{font-family:Unbounded,sans-serif;font-weight:600;font-size:24px;margin:0;line-height:1.2}
  .side p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}
  .side ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
  .side button{width:100%;text-align:left;background:var(--glass);border:1px solid var(--edge);color:var(--text);border-radius:14px;padding:11px 14px;font:500 14px Inter,sans-serif;cursor:pointer;min-height:44px}
  .side button[aria-current="true"]{border-color:var(--lav);color:var(--lav);background:var(--lav-soft)}

  .phone{width:390px;height:844px;border-radius:48px;border:10px solid #1B1A33;box-shadow:0 40px 100px rgba(40,20,120,.45),0 0 0 1px rgba(255,255,255,.06);overflow:hidden;display:flex;flex-direction:column;position:relative;
    background:
      radial-gradient(420px 320px at 15% -8%, rgba(132,104,255,.38), transparent 70%),
      radial-gradient(360px 300px at 110% 35%, rgba(70,150,255,.20), transparent 70%),
      radial-gradient(300px 260px at -10% 95%, rgba(255,150,120,.14), transparent 70%),
      var(--ink)}
  .stars{position:absolute;inset:0;pointer-events:none;background-image:
      radial-gradient(1.2px 1.2px at 40px 60px,#fff8,transparent),radial-gradient(1px 1px at 300px 40px,#fff7,transparent),
      radial-gradient(1.4px 1.4px at 220px 120px,#fff6,transparent),radial-gradient(1px 1px at 120px 200px,#fff5,transparent),
      radial-gradient(1.2px 1.2px at 340px 260px,#fff6,transparent),radial-gradient(1px 1px at 60px 420px,#fff4,transparent),
      radial-gradient(1px 1px at 260px 560px,#fff4,transparent),radial-gradient(1.3px 1.3px at 30px 700px,#fff5,transparent)}
  .screen{flex:1;overflow-y:auto;padding:30px 20px 112px;display:flex;flex-direction:column;gap:18px;position:relative}
  .screen::-webkit-scrollbar{width:0}
  .screen>*{flex-shrink:0}
  h2.title{font-family:Unbounded,sans-serif;font-weight:600;font-size:26px;margin:0;line-height:1.15;letter-spacing:-.01em}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0}
  .muted{color:var(--muted)}
  .row{display:flex;align-items:center;gap:10px}
  .between{justify-content:space-between}
  .card{background:var(--glass);border:1px solid var(--edge);border-radius:24px;padding:16px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
  .chip{min-height:44px;padding:8px 14px;border-radius:16px;font:500 14px Inter,sans-serif;cursor:pointer;background:var(--glass);color:var(--text);border:1.5px solid var(--edge);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:all .15s}
  .chip:hover{background:var(--glass2)}
  .chip[aria-pressed="true"]{background:var(--lav-soft);color:var(--lav);border-color:var(--lav)}
  .chip small{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em}
  .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .scroller{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
  .scroller .chip{flex:0 0 auto}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border-radius:20px;background:var(--lav);color:var(--lav-ink);font:700 15px Inter,sans-serif;border:none;cursor:pointer;width:100%;padding:0 18px;box-shadow:0 10px 30px rgba(170,150,255,.28);transition:transform .1s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--glass);color:var(--text);border:1px solid var(--edge);box-shadow:none}
  .btn.sm{min-height:44px;font-size:14px;border-radius:16px;width:auto}
  .btn:disabled{background:rgba(255,255,255,.08);color:#8C8AAE;cursor:not-allowed;box-shadow:none}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--lav-soft);color:var(--lav);font-weight:700;font-size:13px}
  .tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:rgba(155,232,200,.14);color:var(--mint)}
  .meter{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .meter span{display:block;height:100%;border-radius:99px}
  .tabs{position:absolute;left:12px;right:12px;bottom:14px;display:flex;background:rgba(22,20,48,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--edge);border-radius:28px;padding:6px;z-index:5}
  .tabs button{flex:1;background:none;border:none;color:var(--muted);font:600 10.5px Inter,sans-serif;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;min-height:54px;cursor:pointer;border-radius:22px}
  .tabs button[aria-current="page"]{color:var(--lav-ink);background:var(--lav)}
  .toast{position:absolute;left:20px;right:20px;bottom:100px;background:#F4F2FF;color:#17123A;border-radius:18px;padding:13px 16px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center;box-shadow:0 16px 40px rgba(0,0,0,.45);z-index:6}
  .weather{width:46px;height:46px;border-radius:16px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .list{display:flex;flex-direction:column;gap:10px}
  .item-title{font-weight:600;font-size:15px}
  .small{font-size:13px}
  .big{font-family:Unbounded,sans-serif;font-size:46px;font-weight:600;line-height:1;letter-spacing:-.02em}
  .avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#17123A;flex:0 0 auto}
  .map{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--edge);background:#121131;aspect-ratio:350/400}
  .map svg{position:absolute;inset:0;width:100%;height:100%}
  .dot{position:absolute;transform:translate(-50%,-50%);transition:left 1.8s ease-in-out,top 1.8s ease-in-out;display:flex;flex-direction:column;align-items:center;gap:3px;z-index:2}
  .dot .avatar{width:32px;height:32px;font-size:12px;border:2.5px solid #121131;box-shadow:0 0 0 3px rgba(255,255,255,.18)}
  .dot span{font-size:10px;font-weight:700;background:rgba(10,10,30,.75);padding:2px 6px;border-radius:99px}
  .me .avatar{background:var(--lav)}
  .me::before{content:"";position:absolute;top:16px;left:50%;width:32px;height:32px;margin:-16px 0 0 -16px;border-radius:50%;background:var(--lav);opacity:.5;animation:pulse 2s infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(2.6);opacity:0}}
  .switch{width:50px;height:30px;border-radius:99px;border:none;background:rgba(255,255,255,.14);position:relative;cursor:pointer;flex:0 0 auto}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
  .switch[aria-checked="true"]{background:var(--mint)}
  .switch[aria-checked="true"]::after{left:23px}
  input.field{flex:1;min-width:0;min-height:48px;border-radius:16px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--text);padding:0 14px;font:500 16px Inter,sans-serif}
  input.field::placeholder{color:#8C8AAE}
  .qty{width:36px;height:36px;border-radius:12px;border:1px solid var(--edge);background:var(--glass);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
  .qty.add{background:var(--lav);color:var(--lav-ink);border:none}
  .orderbar{position:absolute;left:12px;right:12px;bottom:92px;z-index:4}
  .mapframe{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--edge);background:#DCD7E9;box-shadow:0 14px 40px rgba(0,0,0,.35)}
  .mapscroll{aspect-ratio:600/520;overflow:auto;scrollbar-width:none;cursor:grab}
  .mapscroll::-webkit-scrollbar{display:none}
  .mapcanvas{position:relative;aspect-ratio:600/520}
  .mapcanvas svg{position:absolute;inset:0;width:100%;height:100%}
  .mapcanvas .mk{width:30px;height:30px;border-width:2.5px}
  .mk.static{position:static;transform:none;width:26px;height:26px;cursor:default;box-shadow:none;flex:0 0 auto;font-size:8px}
  .mk.static:hover{transform:none}
  .zoom{position:absolute;left:10px;top:48px;display:flex;flex-direction:column;gap:6px;z-index:6}
  .zoom button{width:40px;height:40px;border-radius:13px;background:rgba(22,20,48,.88);color:#fff;border:1px solid rgba(255,255,255,.15);cursor:pointer;display:flex;align-items:center;justify-content:center}
  .zoom button:disabled{opacity:.4;cursor:default}
  .nowtag{position:absolute;left:10px;top:10px;z-index:6;display:flex;align-items:center;gap:6px;background:rgba(22,20,48,.88);color:#fff;font:700 11px Inter,sans-serif;padding:7px 10px;border-radius:99px}
  .legendcard summary{list-style:none;cursor:pointer;min-height:24px}
  .legendcard summary::-webkit-details-marker{display:none}
  .dot.small .avatar{width:24px;height:24px;font-size:9px;border-width:2px}
  .dot.small span{font-size:9px}
  .mk{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:#1B1A3A;border:2.5px solid var(--c);color:var(--c);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;box-shadow:0 4px 14px rgba(0,0,0,.45);padding:0;font:800 10px Inter,sans-serif;transition:transform .15s,opacity .15s}
  .mk:hover{transform:translate(-50%,-50%) scale(1.08)}
  .mk[aria-pressed="true"]{background:var(--c);color:#17123A;transform:translate(-50%,-50%) scale(1.18);z-index:4;box-shadow:0 0 0 6px rgba(255,255,255,.12),0 6px 18px rgba(0,0,0,.5)}
  .mk.dim{opacity:.22}
  .mklabel{position:absolute;transform:translate(-50%,-100%);margin-top:-26px;background:#F4F2FF;color:#17123A;font:700 11px Inter,sans-serif;padding:4px 9px;border-radius:99px;white-space:nowrap;z-index:5;pointer-events:none}
  .lm{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:rgba(27,26,58,.85);border:1.5px solid rgba(255,255,255,.25);color:#ABA9CB;display:flex;align-items:center;justify-content:center;font:800 7px Inter,sans-serif;z-index:1}
  .legend{display:flex;gap:14px;flex-wrap:wrap}
  .legend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
  @media (max-width:440px){
    body{padding:0;display:block;min-height:0}
    .side{display:none}
    .phone{width:100vw;height:100vh;height:100dvh;border-radius:0;border:none;box-shadow:none}
    .screen{padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(112px + env(safe-area-inset-bottom))}
    .tabs{bottom:calc(10px + env(safe-area-inset-bottom))}
    .toast{bottom:calc(96px + env(safe-area-inset-bottom))}
    .orderbar{bottom:calc(88px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<aside class="side" aria-label="Prototype guide">
  <h1>NUBO<br><span style="font-size:15px;font-weight:500;color:var(--muted)">Festival app prototype</span></h1>
  <p>Click through it like a real phone app. Your language and currency choices carry across every screen. All numbers, prices, names and places are sample data.</p>
  <ol id="jump"></ol>
</aside>
<main class="phone" aria-label="NUBO app preview">
  <div class="stars" aria-hidden="true"></div>
  <div id="app" style="display:contents"></div>
</main>

          <div style="text-align:right"><div class="item-title" style="color:${l.c}">${v}%</div><div class="small muted">${l.w[S.lang]} · ~${Math.round(v/5)} min</div></div></div>
        <div class="meter" aria-hidden="true"><span style="width:${v}%;background:${l.c}"></span></div>
        <button class="btn ghost sm" style="width:100%" ${done?'disabled':''} onclick="report(${k})">${done?svg('check',18)+' Reported':svg('plus',18)+' '+x.report+' · +10'}</button>
      </div>`}).join('')}</div>
  </div>`;
}
function report(k){S.reported[k+'-'+S.slot]=true;S.points+=10;toast(t().thanks);}

function friends(){
  const x=t();
  return `<div class="screen">
    ${header(x.mTitle,x.mSub)}
    <div class="map" style="aspect-ratio:600/520;background:#DCD7E9" role="img" aria-label="Simple festival map with your friends' live locations">${simpleMap()}${friendDots()}</div>
    <form class="row" onsubmit="addFriend(event)" style="gap:8px">
      <label for="fname" class="sr">${x.namePh}</label>
      <input id="fname" class="field" placeholder="${x.namePh}" autocomplete="off">
      <button class="btn sm" type="submit">${svg('plus',18)} ${x.add}</button>
    </form>
    <div class="list">${S.friends.map((f,i)=>`
      <div class="card row" style="padding:12px 14px">
        <div class="avatar" style="background:${f.color}">${initials(f.name)}</div>
        <div style="flex:1;min-width:0"><div class="item-title">${esc(f.name)}</div><div class="small muted" id="near${i}">Near ${near(f.x,f.y)} · live</div></div>
        <button class="qty" aria-label="Remove ${esc(f.name)}" onclick="removeFriend(${i})">${svg('x',16)}</button>
      </div>`).join('')}</div>
    <div class="card row between" style="padding:14px 16px">
      <div><div class="item-title">${x.shareLoc}</div><div class="small muted">Only the people in your crew can see it.</div></div>
      <button class="switch" role="switch" aria-checked="${S.shareLoc}" aria-label="${x.shareLoc}" onclick="set({shareLoc:!S.shareLoc})"></button>
    </div>
    <button class="btn ghost" onclick="copyInvite()">${svg('link',18)} ${x.invite}</button>
  </div>`;
}
function addFriend(e){
  e.preventDefault();
  const v=document.getElementById('fname').value.trim(); if(!v) return;
  const s=PLACES_MAP[Math.floor(Math.random()*PLACES_MAP.length)];
  const f={name:v.slice(0,20),x:s.x+14,y:s.y+14,color:FRIEND_COLORS[S.friends.length%FRIEND_COLORS.length]};f.tx=f.x;f.ty=f.y;
  S.friends.push(f); toast(f.name+' added to your crew');
}
function removeFriend(i){S.friends.splice(i,1);render();}
function copyInvite(){try{navigator.clipboard.writeText('https://nubo.app/join/CREW-7K2Q').catch(()=>{});}catch(e){} toast('Invite link copied');}
/* live movement of friends on the map */
setInterval(()=>{
  S.friends.forEach((f,i)=>{
    if(Math.random()<.25){const s=PLACES_MAP[Math.floor(Math.random()*PLACES_MAP.length)];f.tx=s.x+(Math.random()*36-18);f.ty=s.y+(Math.random()*36-18);}
    f.x+= (f.tx-f.x)*.35 + (Math.random()*8-4); f.y+= (f.ty-f.y)*.35 + (Math.random()*8-4);
    f.x=Math.max(40,Math.min(570,f.x)); f.y=Math.max(landMinY(f.x),Math.min(495,f.y));
    const el=document.getElementById('f'+i); if(el){el.style.left=pct(f.x,600);el.style.top=pct(f.y,520);}
    const nl=document.getElementById('near'+i); if(nl) nl.textContent='Near '+near(f.x,f.y)+' · live';
  });
},2000);

function placeColor(p){return p.q==null?(p.type==='aid'?'#9BE8C8':'#C9BCFF'):level(p.q).c;}
function home(){
  const x=t();
  if(S.truck!==null) return truckMenu();
  const marks=PLACES_MAP.map(p=>{
    const on=S.filter==='all'||p.type===S.filter, sel=S.sel===p.id;
    return `<button class="mk ${on?'':'dim'}" aria-pressed="${sel}" aria-label="${p.name}${p.q!=null?', '+p.q+'% chance of a queue':''}" onclick="selectPlace('${p.id}')" style="left:${pct(p.x,600)};top:${pct(p.y,520)};--c:${placeColor(p)}">${mkIcon(p.type,17)}</button>`;
  }).join('');
  const selP=PLACES_MAP.find(p=>p.id===S.sel);
  const label=selP?`<div class="mklabel" style="left:${pct(selP.x,600)};top:${pct(selP.y,520)}">${selP.name.replace(/ \(.*\)/,'')}</div>`:'';
  return `<div class="screen">
    ${header(HOME_T[S.lang][0], 'Now · 23:00 · '+HOME_T[S.lang][1])}
    <div class="scroller" role="group" aria-label="Filter the map">${FILTERS[S.lang].map(([k,l])=>`<button class="chip" aria-pressed="${S.filter===k}" onclick="set({filter:'${k}',sel:null})">${l}</button>`).join('')}</div>
    <div class="mapframe">
      <div class="mapscroll" id="mapscroll" onpointerdown="mapDown(event)">
        <div class="mapcanvas" style="width:${ZOOMS[S.zoom]*100}%">${detailMap()}${friendDots('small')}${marks}${label}</div>
      </div>
      <div class="zoom"><button aria-label="Zoom in" onclick="zoomMap(1)" ${S.zoom===ZOOMS.length-1?'disabled':''}>${svg('plus',18)}</button><button aria-label="Zoom out" onclick="zoomMap(-1)" ${S.zoom===0?'disabled':''}>${svg('minus',18)}</button></div>
      <div class="nowtag">${svg('cloud',14)} Live · 23:00</div>
    </div>
    ${placeCard(selP)}
    <details class="card legendcard"><summary class="row between"><span class="eyebrow">Map legend</span>${svg('chev',16)}</summary>
      <div class="grid2" style="margin-top:12px">${Object.entries(TYPE).map(([k,v])=>`<div class="row small" style="gap:8px"><span class="mk static" style="--c:#C9BCFF">${mkIcon(k,14)}</span>${v.label}</div>`).join('')}</div>
      <div class="legend" style="margin-top:12px"><span><i style="background:#8FD3FF"></i>Clear</span><span><i style="background:#FFC78A"></i>Cloudy</span><span><i style="background:#FF8A9A"></i>Stormy (long queue)</span></div>
    </details>
    <div class="row between" style="margin-top:6px"><h3 style="margin:0;font-family:Unbounded;font-weight:600;font-size:18px">${x.foodTitle}</h3><span class="small muted">Prices in ${code()}</span></div>
    <div class="list">${TRUCKS.map((tr,k)=>{const l=level(tr.queue);return `
      <button onclick="set({truck:${k}})" class="card" style="text-align:left;color:inherit;font:inherit;cursor:pointer;display:flex;gap:14px;align-items:center;padding:14px;width:100%">
        <div class="weather" style="width:56px;height:56px;border-radius:18px;background:${tint(tr.color,.18)};color:${tr.color}">${svg('food',26)}</div>
        <div style="flex:1;min-width:0">
          <div class="item-title" style="font-size:16px">${tr.name}</div>
          <div class="small muted">${tr.kind}</div>
          <div class="row small" style="gap:6px;margin-top:6px;color:${l.c}">${svg(l.icon,16)} ${x.queueNow} ~${Math.round(tr.queue/5)} min · from ${money(Math.min(...tr.menu.map(m=>m[3])))}</div>
        </div>
        <span class="muted">${svg('chev',20)}</span>
      </button>`}).join('')}</div>
  </div>`;
}
function selectPlace(id){set({sel:S.sel===id?null:id});}
const ZOOMS=[1,1.6,2.3];
function zoomMap(d){
  const m=document.getElementById('mapscroll'); const cx=(m.scrollLeft+m.clientWidth/2)/m.scrollWidth, cy=(m.scrollTop+m.clientHeight/2)/m.scrollHeight;
  S.zoom=Math.max(0,Math.min(ZOOMS.length-1,S.zoom+d)); render();
  const n=document.getElementById('mapscroll'); n.scrollLeft=cx*n.scrollWidth-n.clientWidth/2; n.scrollTop=cy*n.scrollHeight-n.clientHeight/2;
}
let drag=null;
function mapDown(e){ if(e.pointerType!=='mouse'||e.target.closest('button')) return; const m=e.currentTarget; drag={m,x:e.clientX,y:e.clientY,l:m.scrollLeft,t:m.scrollTop}; m.style.cursor='grabbing'; e.preventDefault(); }
if(typeof window!=='undefined'&&window.addEventListener){
  window.addEventListener('pointermove',e=>{ if(!drag) return; drag.m.scrollLeft=drag.l-(e.clientX-drag.x); drag.m.scrollTop=drag.t-(e.clientY-drag.y); });
  window.addEventListener('pointerup',()=>{ if(drag){ drag.m.style.cursor=''; drag=null; } });
}
function placeCard(p){
  if(!p) return `<div class="card row small muted" style="gap:12px">${svg('pin',22)}<span>Tap a marker to see the queue, how far it is and what to do there. Colours follow Crowd Weather.</span></div>`;
  const c=placeColor(p), l=p.q!=null?level(p.q):null;
  const alt=p.q!=null?PLACES_MAP.filter(o=>o.type===p.type&&o.id!==p.id&&o.q<p.q-15).sort((a,b)=>a.q-b.q)[0]:null;
  const done=S.reported['map-'+p.id];
  let actions='';
  if(p.type==='food') actions+=`<button class="btn" onclick="set({truck:${p.truck}})">${svg('food',18)} ${t().seeMenu}</button>`;
  if(p.type==='meet') actions+=`<button class="btn" onclick="set({screen:'dawn'})">${svg('moon',18)} Open Dawn Pack</button>`;
  if(p.q!=null) actions+=`<button class="btn ghost sm" style="width:100%" ${done?'disabled':''} onclick="S.reported['map-${p.id}']=true;S.points+=10;toast(t().thanks)">${done?svg('check',18)+' Reported':svg('plus',18)+' '+t().report+' · +10'}</button>`;
  const info={aid:'Open all night. Free water, medics and a quiet space.',meet:'Lit and staffed. A Dawn Pack leaves from here every 20 minutes.'}[p.type]||'';
  return `<div class="card" style="display:flex;flex-direction:column;gap:14px;padding:18px;background:linear-gradient(140deg,${tint(c,.18)},rgba(255,255,255,.04));border-color:${tint(c,.4)}">
    <div class="row" style="gap:12px">
      <div class="weather" style="background:${tint(c,.18)};color:${c};font:800 13px Inter">${mkIcon(p.type,24)}</div>
      <div style="flex:1;min-width:0"><div class="item-title" style="font-size:16px">${p.name}</div>
        <div class="small muted row" style="gap:4px">${TYPE[p.type].label} · ${svg('walk',14)} ${walk(p)} min walk</div></div>
      <button class="qty" aria-label="Close" onclick="set({sel:null})">${svg('x',16)}</button>
    </div>
    ${l?`<div class="row" style="gap:12px"><span style="color:${l.c}">${svg(l.icon,28)}</span>
      <div><div class="item-title" style="color:${l.c}">${p.q}% chance of a queue</div><div class="small muted">${l.w[S.lang]} · ~${Math.round(p.q/5)} min wait</div></div></div>`:''}
    ${info?`<p class="small muted" style="margin:0;line-height:1.5">${info}</p>`:''}
    ${alt?`<button class="chip" style="flex-direction:row;justify-content:flex-start;gap:8px;text-align:left;border-color:${tint('#8FD3FF',.5)}" onclick="selectPlace('${alt.id}')"><span style="color:#8FD3FF">${svg('sun',18)}</span><span class="small"><b>${alt.name.replace(/ \(.*\)/,'')}</b> is clearer: only ${alt.q}% · ${walk(alt)} min walk</span></button>`:''}
    ${actions}
  </div>`;
}
function truckMenu(){
  const x=t(), tr=TRUCKS[S.truck], l=level(tr.queue);
  const sections=[...new Set(tr.menu.map(m=>m[0]))];
  const cartItems=Object.entries(S.cart).filter(([k,q])=>q>0);
  const count=cartItems.reduce((a,[,q])=>a+q,0);
  const total=cartItems.reduce((a,[k,q])=>{const [ti,mi]=k.split('-').map(Number);return a+TRUCKS[ti].menu[mi][3]*q;},0);
  return `<div class="screen" style="${count?'padding-bottom:180px':''}">
    <button class="btn ghost sm" style="align-self:flex-start;padding:0 14px" onclick="set({truck:null})">${svg('back',18)} ${HOME_T[S.lang][0]}</button>
    <div class="card" style="padding:20px;background:linear-gradient(140deg,${tint(tr.color,.24)},rgba(255,255,255,.04));border-color:${tint(tr.color,.4)}">
      <h2 class="title">${tr.name}</h2>
      <p class="muted small" style="margin:6px 0 12px">${tr.kind}</p>
      <span class="pill" style="background:${tint(l.c,.16)};color:${l.c}">${svg(l.icon,16)} ${x.queueNow} ~${Math.round(tr.queue/5)} min</span>
    </div>
    ${sections.map(sec=>`<section style="display:flex;flex-direction:column;gap:10px"><p class="eyebrow">${sec}</p>
      ${tr.menu.map((m,mi)=>m[0]!==sec?'':(()=>{const key=S.truck+'-'+mi,q=S.cart[key]||0;return `
      <div class="card row" style="padding:14px;gap:12px;align-items:flex-start">
        <div style="flex:1;min-width:0">
          <div class="row" style="gap:8px;flex-wrap:wrap"><span class="item-title">${m[1]}</span>${m[4]?`<span class="tag">${m[4]}</span>`:''}</div>
          <div class="small muted" style="margin-top:3px">${m[2]}</div>
          <div class="item-title" style="margin-top:8px;color:var(--lav)">${money(m[3])}</div>
        </div>
        <div class="row" style="gap:8px;align-self:center">
          ${q?`<button class="qty" aria-label="Remove one ${m[1]}" onclick="qty('${key}',-1)">${svg('minus',16)}</button><b style="min-width:14px;text-align:center">${q}</b>`:''}
          <button class="qty add" aria-label="Add ${m[1]}" onclick="qty('${key}',1)">${svg('plus',16)}</button>
        </div>
      </div>`})()).join('')}</section>`).join('')}
  </div>
  ${count?`<div class="orderbar"><button class="btn" onclick="placeOrder()">${svg('bag',20)} ${x.placeOrder} · ${count} ${x.order} · ${money(total)}</button></div>`:''}`;
}
function qty(k,d){S.cart[k]=Math.max(0,(S.cart[k]||0)+d);render();}
function placeOrder(){S.cart={};toast('Order placed! Pick up in ~8 min at the side window');}

function rewards(){
  const x=t();
  return `<div class="screen">
    ${header(x.rTitle)}
    <div class="card" style="text-align:center;padding:26px;background:linear-gradient(140deg,rgba(201,188,255,.26),rgba(255,199,138,.10));border-color:rgba(201,188,255,.4)">
      <div class="big" style="color:var(--lav)">${S.points}</div><div class="muted small" style="margin-top:8px">${x.pts}</div>
    </div>
    <div class="list">${REWARDS.map(r=>{const got=S.redeemed[r.id],can=S.points>=r.cost;return `
      <div class="card row" style="gap:12px">
        <div class="weather" style="background:var(--lav-soft);color:var(--lav)">${svg('star',22)}</div>
        <div style="flex:1;min-width:0"><div class="item-title">${r.name}</div><div class="small muted">${r.cost} ${x.pts}${got?' · Code <b style="color:var(--sky)">'+got+'</b>':''}</div></div>
        <button class="btn sm" ${got||!can?'disabled':''} onclick="redeem('${r.id}',${r.cost})">${got?svg('check',18):can?x.redeem:x.need+' '+(r.cost-S.points)}</button>
      </div>`}).join('')}</div>
    <section class="card" style="display:flex;flex-direction:column;gap:12px"><p class="eyebrow">${x.earn}</p>
      <div class="row between small"><span>Report a queue in Crowd Weather</span><b style="color:var(--peach)">+10</b></div>
      <div class="row between small"><span>Confirm a forecast was right</span><b style="color:var(--peach)">+5</b></div>
      <div class="row between small"><span>Walk home with a Dawn Pack</span><b style="color:var(--peach)">+20</b></div>
    </section>
  </div>`;
}
function redeem(id,cost){S.points-=cost;S.redeemed[id]=Math.random().toString(36).slice(2,7).toUpperCase();toast('Redeemed! Show the code at the bar or stand.');}

function dawn(){
  const x=t(), sizes=PACKS[S.area];
  const body = !S.verified ? `
    <div class="card" style="display:flex;flex-direction:column;gap:14px;padding:20px">
      <div class="weather" style="background:rgba(143,211,255,.14);color:var(--sky)">${svg('shield',26)}</div>
      <b style="font-size:17px">Only verified people can join a pack.</b>
      <p class="small muted" style="margin:0;line-height:1.55">Scan your ID once. Your name stays hidden: the group only sees your first name and a verified badge.</p>
      <button class="btn" onclick="set({verified:true});toast('${x.verified}')">${svg('shield',20)} ${x.verify}</button>
    </div>`
  : S.joined ? `
    <div class="card" style="display:flex;flex-direction:column;gap:14px;padding:20px;background:linear-gradient(140deg,rgba(143,211,255,.20),rgba(255,255,255,.04));border-color:rgba(143,211,255,.4)">
      <div class="row" style="color:var(--sky)">${svg('check',26)}<b style="font-size:18px;color:var(--text)">${x.joined}</b></div>
      <div class="row small">${svg('moon',18)} Leaves at <b>${PACK_TIMES[S.pack]}</b> to <b>${S.area}</b></div>
      <div class="row small">${svg('people',18)} ${sizes[S.pack]+1} people, all verified</div>
      <div class="row small">${svg('pin',18)} Meeting point B: lit gate by the main exit</div>
    </div>
    <button class="btn ghost" onclick="toast('Live route shared with your crew')">${svg('share',18)} Share my live route with my crew</button>
    <button class="btn ghost" onclick="set({joined:false})">Leave the pack</button>`
  : `
    <div class="row small" style="color:var(--mint)">${svg('shield',18)} ${x.verified}</div>
    <section style="display:flex;flex-direction:column;gap:10px"><p class="eyebrow">${x.where}</p>
      <div class="scroller" role="group">${AREAS.map(a=>`<button class="chip" aria-pressed="${S.area===a}" onclick="set({area:'${a}'})">${a}</button>`).join('')}</div></section>
    <section style="display:flex;flex-direction:column;gap:10px"><p class="eyebrow">${x.next}</p>
      ${PACK_TIMES.map((tm,k)=>`<button class="chip" aria-pressed="${S.pack===k}" onclick="set({pack:${k}})" style="flex-direction:row;justify-content:space-between;padding:12px 18px;min-height:60px">
        <span class="row">${svg('moon',18)} <b style="font-size:16px">${tm}</b></span><span class="small muted">${sizes[k]} going to ${S.area}</span></button>`).join('')}
    </section>
    <div class="card row small" style="gap:12px;line-height:1.5">${svg('pin',22)}<span>Meeting point B: lit gate by the main exit. Staff check everyone in before the pack leaves.</span></div>
    <button class="btn" onclick="S.points+=20;set({joined:true});toast('+20 points for walking home safely')">${x.join}</button>`;
  return `<div class="screen">${header(x.dTitle,x.dSub)}${body}</div>`;
}

const TABS=[['forecast','cloud','tF'],['friends','people','tM'],['home','home','tH'],['rewards','star','tR'],['dawn','moon','tD']];
const SCREENS={welcome,forecast,friends,home,rewards,dawn};
const NAMES={welcome:'1 · Welcome: language & currency',home:'2 · Home: map & food trucks',forecast:'3 · Crowd Weather',friends:'4 · Friends map',rewards:'5 · Rewards',dawn:'6 · Dawn Pack'};

function render(){
  const ms=document.getElementById('mapscroll'), mapL=ms?ms.scrollLeft:0, mapT=ms?ms.scrollTop:0; const sc=document.querySelector('.screen'), top=sc?sc.scrollTop:0, key=S.screen+'|'+S.truck, same=render.last===key;
  const typed=document.getElementById('fname'); const typedVal=typed&&S.screen==='friends'?typed.value:'';
  document.documentElement.lang=S.lang;
  let html=SCREENS[S.screen]();
  if(S.screen!=='welcome') html+=`<nav class="tabs" aria-label="Main">${TABS.map(([k,ic,lab])=>`<button ${S.screen===k?'aria-current="page"':''} onclick="set({screen:'${k}',truck:null})">${svg(ic,21)}${lab==='tH'?HOME_T[S.lang][0]:t()[lab]}</button>`).join('')}</nav>`;
  if(S.toast) html+=`<div class="toast" role="status">${svg('check',18)} ${esc(S.toast)}</div>`;
  document.getElementById('app').innerHTML=html;
  if(same){document.querySelector('.screen').scrollTop=top; const ms2=document.getElementById('mapscroll'); if(ms2){ms2.scrollLeft=mapL;ms2.scrollTop=mapT;} const f=document.getElementById('fname'); if(f&&typedVal&&!S.toast) f.value=typedVal;}
  render.last=key;
  document.getElementById('jump').innerHTML=Object.keys(NAMES).map(k=>`<li><button aria-current="${S.screen===k}" onclick="set({screen:'${k}',truck:null})">${NAMES[k]}</button></li>`).join('');
}
render();
</script>
